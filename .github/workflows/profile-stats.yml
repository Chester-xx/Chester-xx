name: Update profile stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=121214&title_color=448AFF&text_color=8A8F9B&icon_color=6E8FFF&ring_color=448AFF
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=121214&title_color=448AFF&text_color=8A8F9B
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=121214&stroke=2D3344&ring=448AFF&fire=448AFF&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=448AFF&sideLabels=8A8F9B&dates=8A8F9B
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push cards to status branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update profile stats"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" status
